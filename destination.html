        <nav class="navbar" aria-label="Main navigation"><a href="index.html" class="brand"><img src="Logo.png" alt="LakbayPH Logo"><div class="logo">Lakbay<span>PH</span></div></a><div class="navlink"><a href="index.html">Home</a>

        <main class="content">
  <h1>Explore Destinations</h1>
  <p class="intro">Find and explore tourist spots across the Philippines.</p>
  <div class="search-bar" role="search">
    <input id="destinationSearch" type="search" placeholder="Search destinations..." aria-label="Search destinations">
  </div>
  <div class="main-container">
    <aside class="sidebar" aria-label="Destination filters">
      <h3>Island Group</h3><ul class="filter-list" id="islandFilters"></ul>
      <h3>Categories</h3><ul class="filter-list" id="categoryFilters"></ul>
      <button type="button" class="clear-btn" id="clearFilters">Clear Filters</button>
    </aside>
    <section class="results" aria-label="Destinations">
      <p id="resultCount" role="status" aria-live="polite"></p>
      <div class="cards-grid" id="destinationCards"></div>
      <nav class="pages" id="pagination" aria-label="Destination pages"></nav>
    </section>
  </div>
  <noscript>Please enable JavaScript to search and filter the destination catalog.</noscript>
</main>
    <script src="destinations.js"></script><script src="destination.js"></script></body>
